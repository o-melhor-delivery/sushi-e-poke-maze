<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MazeGohan • Cupom Exclusivo iFood</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#111;color:#fff}
.wrap{max-width:500px;margin:auto;min-height:100vh;padding:20px;display:flex;align-items:center}
.hero{position:relative;width:100%}
.hero img{width:100%;border-radius:24px;display:block}
.cta{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);padding:16px 26px;border:0;border-radius:14px;background:#ea1d2c;color:#fff;font-weight:bold;cursor:pointer}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75)}
.box{background:#fff;color:#333;max-width:420px;margin:8vh auto;padding:24px;border-radius:18px}
.close{float:right;font-size:28px;cursor:pointer}
input{width:100%;padding:12px;margin:8px 0 16px;border:2px solid #ea1d2c;border-radius:10px}
button.send{width:100%;padding:14px;background:#ea1d2c;color:#fff;border:0;border-radius:10px;font-weight:bold}
.msg{display:none;margin-top:12px;padding:10px;border-radius:8px}
.ok{background:#d4edda;color:#155724}.err{background:#f8d7da;color:#721c24}
</style>
</head>
<body>
<div class="wrap">
<div class="hero">
<img src="bg-landing.jpg.jpeg" alt="MazeGohan">
<button class="cta" id="open">🛵 Peça Agora</button>
</div>
</div>

<div class="modal" id="modal">
<div class="box">
<span class="close" id="close">&times;</span>
<h2 style="color:#ea1d2c;text-align:center">🎉 <strong>Cupom Exclusivo iFood</strong></h2>
<p>Preencha seu nome e telefone para receber o cupom.</p>
<form id="f">
<label>Nome</label>
<input id="nome" required>
<label>Telefone</label>
<input id="telefone" required placeholder="(44) 99999-9999">
<button class="send" type="submit">Receber Cupom 🎁</button>
<div class="msg ok" id="ok">Cadastro realizado! Redirecionando...</div>
<div class="msg err" id="er">Erro ao enviar.</div>
</form>
</div>
</div>

<script>
const api='https://script.google.com/macros/s/AKfycbxyQ71TuocqnzJkemxoRGHR8IBIHldAE3hv44FoOb8U5AyBEJhjdHSLlPyYsQV5qKAo/exec';
const ifood='https://www.ifood.com.br/delivery/maringa-pr/sushi--poke-mazegohan-zona-03/7e70a00a-be4c-4142-9d35-ed2bb6ade202';
open.onclick=()=>modal.style.display='block';
close.onclick=()=>modal.style.display='none';
window.onclick=e=>{if(e.target===modal)modal.style.display='none';}
telefone.oninput=e=>{
let v=e.target.value.replace(/\D/g,'').slice(0,11);
if(v.length<=2)e.target.value='('+v;
else if(v.length<=7)e.target.value='('+v.slice(0,2)+') '+v.slice(2);
else e.target.value='('+v.slice(0,2)+') '+v.slice(2,7)+'-'+v.slice(7);
}
f.onsubmit=async(ev)=>{
ev.preventDefault();
ok.style.display='none';er.style.display='none';
try{
await fetch(api,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome:nome.value,telefone:telefone.value})});
ok.style.display='block';
setTimeout(()=>location.href=ifood,1500);
}catch(e){er.style.display='block';}
}
</script>
</body>
</html>
