<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chegamos Maringa - Sushi e Poke</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            font-family: 'Arial', sans-serif;
            background: #1a1a1a;
            height: 100%;
            width: 100%;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            position: relative;
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        .image-container {
            width: 100%;
            background-image: url('bg-landing.jpg.jpeg');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center top;
            aspect-ratio: 9 / 16;
            border-radius: 20px;
            position: relative;
            overflow: visible;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .button-wrapper {
            position: absolute;
            top: 36.5%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 75%;
            z-index: 10;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background-color: #f9f9f9;
            margin: 50% auto;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-content h2 {
            color: #ea1d2c;
            margin-bottom: 15px;
            font-size: 18px;
            text-align: center;
        }

        .modal-content p {
            color: #333;
            font-size: 14px;
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ea1d2c;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #d41a23;
            box-shadow: 0 0 10px rgba(234, 29, 44, 0.2);
        }

        .form-group input::placeholder {
            color: #999;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ea1d2c 0%, #d41a23 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(234, 29, 44, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .close {
            color: #999;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .close:hover {
            color: #ea1d2c;
        }

        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            color: #666;
            font-size: 12px;
            margin-top: 10px;
        }

        .security-badge::before {
            content: "🔒";
            font-size: 14px;
        }

        .ifood-button {
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, #ea1d2c 0%, #d41a23 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(234, 29, 44, 0.4);
            font-family: 'Arial', sans-serif;
        }

        .ifood-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(234, 29, 44, 0.6);
        }

        .ifood-button:active {
            transform: translateY(0);
        }

        .success-message {
            display: none;
            color: #28a745;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            background-color: #d4edda;
            margin-top: 10px;
        }

        .error-message {
            display: none;
            color: #dc3545;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            background-color: #f8d7da;
            margin-top: 10px;
        }

        @media (max-width: 480px) {
            .ifood-button {
                font-size: 14px;
                padding: 12px 18px;
            }

            .modal-content {
                margin: 30% auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="image-wrapper">
            <div class="image-container">
                <div class="button-wrapper">
                    <button class="ifood-button" id="openFormBtn">
                        🛵 Peça Agora
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal com Formulário -->
    <div id="formModal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeBtn">&times;</span>
            <h2>🎉 Cupom de Desconto Exclusivo!</h2>
            <p>Para acessar o link com cupom de desconto exclusivo preencha seu número celular com DDD aqui</p>
            <p style="font-size: 12px; color: #999;">(É totalmente seguro)</p>
            
            <form id="contactForm">
                <div class="form-group">
                    <label for="clientName">Nome:</label>
                    <input 
                        type="text" 
                        id="clientName" 
                        name="clientName" 
                        placeholder="Digite seu nome"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="clientPhone">Número com DDD:</label>
                    <input 
                        type="tel" 
                        id="clientPhone" 
                        name="clientPhone" 
                        placeholder="(44) 99999-9999"
                        pattern="^\(\d{2}\)\s?\d{4,5}-\d{4}$"
                        required
                    >
                </div>

                <button type="submit" class="submit-btn">Receber Cupom 🎁</button>
                
                <div class="security-badge">
                    Seus dados estão seguros
                </div>

                <div class="success-message" id="successMessage">
                    ✅ Dados enviados com sucesso! Confira seu WhatsApp!
                </div>

                <div class="error-message" id="errorMessage">
                    ❌ Erro ao enviar. Tente novamente.
                </div>
            </form>
        </div>
    </div>

    <script>
        const modal = document.getElementById('formModal');
        const openFormBtn = document.getElementById('openFormBtn');
        const closeBtn = document.getElementById('closeBtn');
        const contactForm = document.getElementById('contactForm');
        const successMessage = document.getElementById('successMessage');
        const errorMessage = document.getElementById('errorMessage');

        // Abrir modal ao clicar no botão
        openFormBtn.addEventListener('click', () => {
            modal.style.display = 'block';
        });

        // Fechar modal ao clicar no X
        closeBtn.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        // Fechar modal ao clicar fora
        window.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.style.display = 'none';
            }
        });

        // Formatar telefone
        const phoneInput = document.getElementById('clientPhone');
        phoneInput.addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 11) value = value.slice(0, 11);
            
            if (value.length === 0) {
                e.target.value = '';
            } else if (value.length <= 2) {
                e.target.value = `(${value}`;
            } else if (value.length <= 6) {
                e.target.value = `(${value.slice(0, 2)}) ${value.slice(2)}`;
            } else {
                e.target.value = `(${value.slice(0, 2)}) ${value.slice(2, 7)}-${value.slice(7)}`;
            }
        });

        // Enviar formulário
        contactForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('clientName').value;
            const phone = document.getElementById('clientPhone').value;

            try {
                const response = await fetch('https://script.google.com/macros/s/AKfycbxyQ71TuocqnzJkemxoRGHR8IBIHldAE3hv44FoOb8U5AyBEJhjdHSLlPyYsQV5qKAo/exec', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
    nome: name,
    telefone: phone
})
                    })
                });

                if (response.ok) {
                    successMessage.style.display = 'block';
                    errorMessage.style.display = 'none';
                    
                    setTimeout(() => {
                        // Redirecionar para o iFood após 2 segundos
                        window.location.href = 'https://www.ifood.com.br/delivery/maringa-pr/sushi--poke-mazegohan-zona-03/7e70a00a-be4c-4142-9d35-ed2bb6ade202?UTM_Medium=share';
                    }, 2000);
                } else {
                    errorMessage.style.display = 'block';
                    successMessage.style.display = 'none';
                }
            } catch (error) {
                console.error('Erro:', error);
                errorMessage.style.display = 'block';
                successMessage.style.display = 'none';
            }
        });
    </script>
</body>
</html>
